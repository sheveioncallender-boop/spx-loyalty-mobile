name: jennys_rewards
description: Jenny's on the Boulevard customer app for Odoo 19.
publish_to: none
version: 0.9.2+18
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  flutter_secure_storage: 10.3.1
  webview_flutter: ^4.14.1
  barcode_widget: 2.0.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/manrope-400.ttf
          weight: 400
        - asset: assets/fonts/manrope-500.ttf
          weight: 500
        - asset: assets/fonts/manrope-600.ttf
          weight: 600
        - asset: assets/fonts/manrope-700.ttf
          weight: 700
        - asset: assets/fonts/manrope-800.ttf
          weight: 800
